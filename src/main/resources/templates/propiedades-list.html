<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alojamientos - RentPlace</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .card-img-top { height: 200px; object-fit: cover; }
        .prop-card { transition: transform 0.2s; }
        .prop-card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        .bg-gradient-primary { background: linear-gradient(45deg, #f97316, #eab308); }
    </style>
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
  <div class="container">
    <a class="navbar-brand d-flex align-items-center gap-2" href="/home">
         <img src="/assets/logo.png" width="30" height="30" alt="Logo"> RentPlace
    </a>
    <div class="d-flex">
        <a href="/home" class="btn btn-outline-light btn-sm">Volver al Inicio</a>
    </div>
  </div>
</nav>

<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Alojamientos Disponibles</h2>
        <form action="/propiedades/buscar" method="get" class="d-flex gap-2">
            <input type="text" name="ciudad" th:value="${ciudadBusqueda}" class="form-control form-control-sm" placeholder="Ciudad...">
            <button type="submit" class="btn btn-primary btn-sm"><i class="fas fa-search"></i></button>
        </form>
    </div>
    
    <div th:if="${propiedades.empty}" class="alert alert-warning text-center p-5">
        <h4 class="alert-heading"><i class="fas fa-search-minus"></i> Vaya...</h4>
        <p>No hemos encontrado alojamientos que coincidan con tu búsqueda.</p>
        <hr>
        <a href="/propiedades/listado" class="btn btn-outline-dark">Ver todos los alojamientos</a>
    </div>

    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
        <div class="col" th:each="propiedad : ${propiedades}">
            <div class="card h-100 prop-card border-0 shadow-sm">
                <img src="/assets/casa.png" class="card-img-top bg-light" alt="Imagen propiedad">
                
                <div class="card-body">
                    <h5 class="card-title text-truncate" th:text="${propiedad.titulo}">Título de la casa</h5>
                    <p class="card-text text-muted small mb-2">
                        <i class="fas fa-map-marker-alt text-danger"></i> 
                        <span th:text="${propiedad.ciudad}">Ciudad</span> 
                        <span th:if="${propiedad.tipoInmueble}" th:text="'• ' + ${propiedad.tipoInmueble}"></span>
                    </p>
                    <p class="card-text text-truncate" th:text="${propiedad.descripcion}">Descripción...</p>
                    
                    <div class="d-flex justify-content-between align-items-center mt-3 pt-3 border-top">
                        <span class="fs-5 fw-bold text-primary">
                            <span th:text="${propiedad.precioNoche}">0</span> € <small class="text-muted fs-6">/noche</small>
                        </span>
                        <a th:href="@{/propiedades/{id}(id=${propiedad.id})}" class="btn btn-primary btn-sm rounded-pill px-3">
                            Ver detalles
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

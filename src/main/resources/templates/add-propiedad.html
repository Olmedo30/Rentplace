<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Añadir Propiedad</title>
    <link rel="stylesheet" href="../css/register_style.css">
    <link rel="shortcut icon" href="../assets/logo.png" />
</head>
<body>
    <div class="register-container">
        <h1>
            <b>Añadir Nueva Propiedad</b>
        </h1>
        <hr>
        <hr class="dec">

        <div class="inregister-container">
            <form action="/propiedades/add" method="post">
                <p th:if="${error}" th:text="${error}" class="error-message"></p>

                <p>
                    <label for="titulo">Título</label>
                    <input type="text" id="titulo" name="titulo" required />
                </p>

                <p>
                    <label for="descripcion">Descripción</label>
                    <textarea id="descripcion" name="descripcion"></textarea>
                </p>

                <p>
                    <label for="direccion">Dirección</label>
                    <input type="text" id="direccion" name="direccion" />
                </p>

                <p>
                    <label for="ciudad">Ciudad</label>
                    <input type="text" id="ciudad" name="ciudad" />
                </p>

                <p>
                    <label for="tipoInmueble">Tipo de Inmueble</label>
                    <select id="tipoInmueble" name="tipoInmueble">
                        <option value="Apartamento">Apartamento</option>
                        <option value="Casa">Casa</option>
                        <option value="Habitacion">Habitación</option>
                        <option value="Loft">Loft</option>
                        <option value="Chalet">Chalet</option>
                    </select>
                </p>

                <p>
                    <label for="capacidad">Capacidad</label>
                    <input type="number" id="capacidad" name="capacidad" value="1" min="1" required />
                </p>

                <p>
                    <label for="precioNoche">Precio por Noche</label>
                    <input type="number" id="precioNoche" name="precioNoche" step="0.01" required />
                </p>

                <p>
                    <label for="politica_cancelacion">Política de Cancelación</label>
                    <input type="text" id="politica_cancelacion" name="politica_cancelacion" />
                </p>

                <p>
                    <input type="checkbox" id="permite_reserva_inmediata" name="permite_reserva_inmediata" value="true" />
                    <label for="permite_reserva_inmediata" style="display: inline-block; margin-left: 0.5rem;">Permite Reserva Inmediata</label>
                </p>

                <button type="submit">Añadir Propiedad</button>
            </form>

            <p style="text-align: center; margin-top: 2rem;">
                <a href="/propiedades/listado">Ver Listado de Propiedades</a>
            </p>
        </div>
    </div>
</body>
</html>
